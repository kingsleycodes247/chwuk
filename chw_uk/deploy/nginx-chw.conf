# /etc/nginx/sites-available/chw   (replace YOUR_DOMAIN; certbot adds the HTTPS part for you)
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Programme uploads can be up to 8 MB; nginx's default of 1 MB would reject them with a 413.
    client_max_body_size 10m;

    location /static/ {
        alias /srv/chw/app/staticfiles/;
        expires 1h;
    }

    location /media/ {
        alias /srv/chw/app/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
